<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css?v=2" />
  <link rel="stylesheet" href="styles/base.css?v=2" />
  <link rel="stylesheet" href="styles/layout.css?v=2" />
  <link rel="stylesheet" href="styles/components.css?v=2" />
  <link rel="stylesheet" href="styles/pages.css?v=2" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">AF</div>
        <div class="sidebar-brand">AgentFlow</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <span><span class="status-dot"></span><span class="status-text" data-i18n-key="status_indicator_online">ONLINE</span></span>
        <span class="muted tiny" id="client-count-badge">0 agents</span>
      </div>
    </aside>

    <!-- Topbar -->
    <header class="topbar">
      <button class="topbar-sidebar-toggle" id="toggle-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="topbar-actions">
        <div class="active-project-indicator" id="active-project-indicator" title="Per-client active project (most-recently-active MCP client)">
          <span class="muted tiny">Active:</span>
          <span class="active-project-name" id="active-project-name">—</span>
        </div>
        <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">🌓</button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </header>

    <!-- Routed content -->
    <main class="outlet" id="outlet">
      <div class="page-empty"><p>Loading…</p></div>
    </main>
  </div>

  <!-- Portals -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
